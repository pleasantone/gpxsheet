# Self-hosted GPXSheet service: FastAPI API + Dramatiq worker + Redis + MinIO.
# Quick start:  docker compose up --build
#   API   -> http://localhost:8000/docs
#   MinIO -> http://localhost:9001  (console; minioadmin / minioadmin)

x-service-env: &service-env
  GPXSHEET_REDIS_URL: redis://redis:6379/0
  GPXSHEET_MINIO_ENDPOINT: minio:9000
  GPXSHEET_MINIO_ACCESS_KEY: minioadmin
  GPXSHEET_MINIO_SECRET_KEY: minioadmin
  GPXSHEET_MINIO_BUCKET: gpxsheet

services:
  api:
    build: .
    environment: *service-env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: .
    command: dramatiq gpxsheet.service.jobs
    environment: *service-env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
