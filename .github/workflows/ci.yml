name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (py${{ matrix.python-version }}, ${{ matrix.extras }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Run both ways: without the service stack (its tests skip) and with it.
        extras: ["dev", "dev,service"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  package:
    # Build the distribution and validate its metadata so packaging breakage is
    # caught on PRs, before a v* tag triggers the publish workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build + check distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

  docs:
    # Build the docs site (strict) so broken links / autodoc / OpenAPI gen fail
    # on PRs, the same way ReadTheDocs will build it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,service]"
          mkdocs build --strict

  audit:
    # Fail the build on a known CVE in a runtime dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ".[service]"
          pip-audit --skip-editable
