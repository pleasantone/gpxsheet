name: E2E tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/gpxsheet/service/**"
  pull_request:
    paths:
      - "frontend/**"
      - "src/gpxsheet/service/**"
  workflow_dispatch:
    inputs:
      comprehensive:
        description: "Run comprehensive (full-docker) tests"
        type: boolean
        default: false

jobs:
  smoke:
    name: Smoke (simple mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[service]"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npx playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: cd frontend && npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Start API (simple mode, serves built SPA)
        # GPXSHEET_DISABLE_OSM forces geometry-only analysis: the smoke test
        # exercises the SPA -> API -> render pipeline, not OSM accuracy, and the
        # sample route is offshore (geometry-only is its intended path). Without
        # it the synchronous EagerRunner blocks on a live Overpass call whose
        # latency is unbounded, intermittently exceeding the test timeout.
        env:
          GPXSHEET_DISABLE_OSM: "1"
        run: python -m uvicorn gpxsheet.service.asgi:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Wait for API
        run: cd frontend && npx wait-on http-get://127.0.0.1:8000/healthz --timeout 30000
      - name: Run smoke tests
        run: cd frontend && BASE_URL=http://127.0.0.1:8000 npx playwright test tests/smoke.spec.ts
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/api.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-smoke
          path: frontend/test-results/

  comprehensive:
    name: Comprehensive (full docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.comprehensive
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev,service]"
      - run: cd frontend && npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npx playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: cd frontend && npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Cache osmnx Overpass responses
        uses: actions/cache@v5
        with:
          path: ~/.cache/osmnx
          key: osmnx-${{ hashFiles('examples/sample_route.gpx') }}
          restore-keys: osmnx-
      - run: make frontend
      - name: Start full stack
        run: docker compose up --build -d
      - name: Wait for API
        run: cd frontend && npx wait-on http-get://localhost:8000/healthz --timeout 60000
      - name: Run comprehensive tests
        run: cd frontend && BASE_URL=http://localhost:8000 npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-comprehensive
          path: frontend/test-results/
      - if: always()
        run: docker compose down
