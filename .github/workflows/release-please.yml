name: release-please

# Maintains a release PR that, when merged, tags the release, updates
# CHANGELOG.md, and bumps gpxsheet.__version__. Driven by Conventional Commits
# landing on main.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
