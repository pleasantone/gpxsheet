name: Deploy to Hugging Face Space

# Sync the repo to the Hugging Face Space after CI passes on main (and on demand).
# The Space builds the Dockerfile from source; see deploy/huggingface/README.md.
#
# Gated on CI: this runs via workflow_run when the "CI" workflow completes on main,
# and only deploys if that run succeeded — so the Space never rebuilds from a commit
# whose lint/tests/typecheck/packaging failed (or is still running). workflow_dispatch
# stays a manual escape hatch that bypasses the gate.
#
# Auth uses HF Trusted Publishing (OIDC) — no HF_TOKEN secret to store or rotate.
# The hf CLI detects GitHub Actions, exchanges the job's OIDC identity token for a
# short-lived, repo-scoped HF token, and uses it for the upload.
#
# One-time setup (see docs/deploy.md):
#   - Create a Docker Space on Hugging Face.
#   - On the Space's Settings -> Trusted Publishers, add a GitHub Actions publisher
#     with claims: repository=<owner>/gpxsheet, branch=main, workflow=deploy-hf.yml
#   - Add repo variable HF_SPACE = "<user>/<space>" (e.g. pleasantone/gpxsheet).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if the Space isn't configured yet (forks/unset repos), and — for the
    # CI-completion trigger — only proceed if that CI run succeeded. A manual
    # workflow_dispatch has no workflow_run payload, so it deploys unconditionally.
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    permissions:
      id-token: write # mint the OIDC token for the trusted-publisher exchange
      contents: read
    steps:
      # Deploy the exact commit CI passed on: workflow_run defaults to the branch
      # tip, which may have advanced. (Empty head_sha on dispatch -> branch ref.)
      - uses: actions/checkout@v6 # no submodules: not needed for the image build
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync working tree to the Space
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          # Token minted by the exchange is scoped to this resource (the Space).
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE }}
          # The gated commit (matches the checked-out ref above).
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # The Space's root README must carry the HF frontmatter.
          cp deploy/huggingface/README.md README.md
          # Upload only what the image build needs (allow-list), and --delete="*"
          # removes anything else already on the Space. This keeps the public
          # Space free of tests/, docs/, .env.dev, .claude/, etc.
          hf upload "$HF_SPACE" . . \
            --repo-type=space \
            --delete="*" \
            --include="Dockerfile" \
            --include=".dockerignore" \
            --include="pyproject.toml" \
            --include="README.md" \
            --include="LICENSE" \
            --include="src/*" \
            --include="frontend/*" \
            --exclude="frontend/tests/*" \
            --exclude="frontend/test-results/*" \
            --commit-message="Deploy ${DEPLOY_SHA::7} from GitHub Actions"
