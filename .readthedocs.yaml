# ReadTheDocs build config. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # `service` is needed so the OpenAPI hook can import the FastAPI app.
    - method: pip
      path: .
      extra_requirements:
        - docs
        - service
