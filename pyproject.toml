[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpxsheet"
dynamic = ["version"]
description = "Convert GPX routes into glanceable, map-centric motorcycle navigation PDFs for tank-bag use."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Paul Traina" }]
keywords = ["gpx", "motorcycle", "navigation", "roadbook", "sport-touring", "pdf", "osm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# GPX parsing, the schematic renderer, the CLI, and OSM enrichment (osmnx pulls
# in the geopandas/networkx geo stack; shapely is used directly by enrich.py).
dependencies = [
    "gpxpy>=1.6",
    "matplotlib>=3.8",
    "osmnx>=2.0",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Milestone 5 web service: FastAPI API + Dramatiq/Redis job queue + MinIO storage.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "dramatiq[redis]>=1.16",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "aiofiles>=23.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
    "httpx2>=2.3",  # Starlette TestClient backend; httpx (0.x) is deprecated for it
]
# Documentation site (MkDocs Material + mkdocstrings). Built on ReadTheDocs with
# the `service` extra so the OpenAPI generation hook can import the FastAPI app.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-swagger-ui-tag>=0.6",
]

[project.scripts]
gpxsheet = "gpxsheet.cli:app"

[project.urls]
Homepage = "https://github.com/pleasantone/gpxsheet"
Source = "https://github.com/pleasantone/gpxsheet"
Issues = "https://github.com/pleasantone/gpxsheet/issues"

[tool.setuptools.dynamic]
version = { attr = "gpxsheet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpxsheet = ["py.typed", "fonts/*.ttf", "fonts/OFL.txt", "service/static/**/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer relies on function calls (typer.Option/Argument) in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
# Geo/plotting/web deps ship no stubs; we don't want their internals to gate us.
ignore_missing_imports = true
# Type-check the bodies of unannotated functions too (notably the test suite),
# so the mypy gate is meaningful for all our code, not just annotated defs.
check_untyped_defs = true
# Teach mypy that pydantic models synthesize __init__ with defaulted fields
# (otherwise RenderParams() reads as "missing named arguments").
plugins = ["pydantic.mypy"]
