[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpxsheet"
version = "0.1.0"
description = "Convert GPX routes into glanceable, map-centric motorcycle navigation PDFs for tank-bag use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Traina" }]
keywords = ["gpx", "motorcycle", "navigation", "roadbook", "sport-touring", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "gpxpy>=1.6",
    "shapely>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# OSM enrichment is heavy (pulls geopandas, scipy, etc.). Kept optional so the
# core analysis/render path can be installed without the full geo stack.
osm = ["osmnx>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
gpxsheet = "gpxsheet.cli:app"

[project.urls]
Homepage = "https://github.com/pleasantone/gpxsheet"
Source = "https://github.com/pleasantone/gpxsheet"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer relies on function calls (typer.Option/Argument) in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
