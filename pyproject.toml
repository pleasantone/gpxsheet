[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpxsheet"
dynamic = ["version"]
description = "Convert GPX routes into glanceable, map-centric motorcycle navigation PDFs for tank-bag use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Traina" }]
keywords = ["gpx", "motorcycle", "navigation", "roadbook", "sport-touring", "pdf", "osm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Core: GPX parsing, the schematic renderer, and the CLI. The OSM enrichment
# stack (osmnx + shapely + geopandas ...) is an optional extra.
dependencies = [
    "gpxpy>=1.6",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
osm = ["osmnx>=2.0", "shapely>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
gpxsheet = "gpxsheet.cli:app"

[project.urls]
Homepage = "https://github.com/pleasantone/gpxsheet"
Source = "https://github.com/pleasantone/gpxsheet"
Issues = "https://github.com/pleasantone/gpxsheet/issues"

[tool.setuptools.dynamic]
version = { attr = "gpxsheet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpxsheet = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer relies on function calls (typer.Option/Argument) in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
